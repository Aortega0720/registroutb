name: Django Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: registrodb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_HOST: localhost
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'django-secret-ci-only' }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Requerido por SonarCloud para análisis de ramas

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependencias
      run: pip install -r requirements.txt

    - name: Ejecutar pruebas unitarias (sin Selenium)
      run: |
        pytest usuarios/tests/test_registro.py \
          --cov=usuarios \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=90 \
          -v

    - name: Subir reporte de cobertura
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    - name: Análisis SonarCloud
      uses: uses: SonarSource/sonarqube-scan-action@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.python.coverage.reportPaths=coverage.xml